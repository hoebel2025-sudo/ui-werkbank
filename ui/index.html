<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI-Werkbank</title>
<style>
:root{--bg:#ecebe6;--surf:#fcfcfb;--panel:#f4f3ef;--line:#e1e0d9;--line2:#c8c6bd;--ink:#141412;--ink2:#4f4e4a;--ink3:#7c7a74;--ac:#1c5cab;--acw:#e6eefa;
  --good:#0a7a1e;--warn:#8a5d00;--bad:#8a1f1f;--mark:#e0b000;--markbg:#fff6d6;--schatten:rgba(20,20,18,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191917;--surf:#22221f;--panel:#2a2a26;--line:#34332f;--line2:#4a4944;--ink:#ecebe6;--ink2:#c3c1b9;--ink3:#95938b;
  --ac:#6b9be0;--acw:#23324a;--good:#4fb35e;--warn:#d4a33a;--bad:#e06a6a;--mark:#f0c63a;--markbg:#3a3318;--schatten:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191917;--surf:#22221f;--panel:#2a2a26;--line:#34332f;--line2:#4a4944;--ink:#ecebe6;--ink2:#c3c1b9;--ink3:#95938b;
  --ac:#6b9be0;--acw:#23324a;--good:#4fb35e;--warn:#d4a33a;--bad:#e06a6a;--mark:#f0c63a;--markbg:#3a3318;--schatten:rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
*{box-sizing:border-box}
[hidden]{display:none!important}
.lokalleiste{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.lokalleiste .sp{margin-left:auto}.lokalleiste small{color:var(--ink3)}
.msg.agent,.msg.codex,.msg.system{align-self:flex-start;background:var(--panel)}
.status.fehler{color:var(--bad)}
button,select,input{font:inherit;font-size:12px;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line2);background:var(--surf);border-radius:4px;padding:3px 9px}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
select,input[type=text]{border:1px solid var(--line2);background:var(--surf);border-radius:4px;padding:3px 6px}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
/* Ansichtsleiste: Projekt- und Versionsbrowser der Seite */
.vleiste{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-variant-numeric:tabular-nums}
.vleiste .lab{font-size:11px;color:var(--ink3)}
.vleiste .n{color:var(--ink2);max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vleiste .m{color:var(--ink3);font-size:12px}
.vleiste.alt{background:var(--markbg);border-color:var(--mark)}
.vleiste .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.abweich{font-size:11.5px;border:1px dashed var(--ac);color:var(--ac);border-radius:10px;padding:1px 8px}
/* Arbeitsfläche */
.flaeche{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:8px;flex:1;min-height:0}
@media (max-width:820px){.flaeche{grid-template-columns:1fr}}
.rahmen{position:relative;min-height:0;display:flex}
.ueber{position:absolute;inset:0;z-index:5;cursor:crosshair}
.ueber svg{position:absolute;inset:0;width:100%;height:100%}
.ueber .mnr{cursor:pointer}
.ueberLeiste{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2;display:flex;gap:6px;align-items:center;background:#1f1f1c;color:#ecebe6;border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:default;white-space:nowrap}
.ueberLeiste button{background:#2e2e2a;color:#ecebe6;border-color:#4a4944}.ueberLeiste button.on{background:#d62d20;border-color:#d62d20;color:#fff}
.mlabel{position:absolute;z-index:3;font:12px system-ui,sans-serif;padding:3px 6px;border:1.5px solid #d62d20;border-radius:4px;background:#fff;color:#141412;width:230px}
button.rot{background:#d62d20;border-color:#d62d20;color:#fff}
.chip img{height:18px;border-radius:2px;border:1px solid var(--line2)}
.chip.snap{cursor:pointer}.msg .ref.sc{border-color:#d62d20;color:#d62d20;background:#fdeceb;cursor:pointer}
iframe{width:100%;height:100%;min-height:420px;border:1px solid var(--line);border-radius:6px;background:var(--surf)}
.aend{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.aend h2{font-size:11.5px;color:var(--ink3);font-weight:600;margin:0}
.aend .eintrag{border:1px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;font-size:12px}
.aend .eintrag:hover{border-color:var(--mark)}.aend .eintrag.aktiv{border-color:var(--mark);background:var(--markbg)}
.aend .eintrag small{display:block;color:var(--ink3)}
.leer{color:var(--ink3);font-size:12px}
.hinweis{font-size:11px;color:var(--ink3)}
/* Chatfenster */
.chat{position:fixed;z-index:10;width:600px;height:560px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);
  background:var(--surf);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 28px var(--schatten);display:grid;grid-template-rows:auto minmax(0,1fr)}
.chat.klein{height:auto!important;width:auto!important}
.chat.klein .innen,.chat.klein .rz{display:none}
.rz{position:absolute;z-index:2}
.rz[data-d=n],.rz[data-d=s]{left:10px;right:10px;height:8px;cursor:ns-resize}.rz[data-d=n]{top:-4px}.rz[data-d=s]{bottom:-4px}
.rz[data-d=e],.rz[data-d=w]{top:10px;bottom:10px;width:8px;cursor:ew-resize}.rz[data-d=e]{right:-4px}.rz[data-d=w]{left:-4px}
.rz[data-d=ne],.rz[data-d=nw],.rz[data-d=se],.rz[data-d=sw]{width:14px;height:14px}
.rz[data-d=ne]{top:-5px;right:-5px;cursor:nesw-resize}.rz[data-d=sw]{bottom:-5px;left:-5px;cursor:nesw-resize}
.rz[data-d=nw]{top:-5px;left:-5px;cursor:nwse-resize}.rz[data-d=se]{bottom:-5px;right:-5px;cursor:nwse-resize}
.ckopf{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:move;user-select:none;background:var(--panel);border-radius:8px 8px 0 0;flex-wrap:nowrap;min-width:0}
.ckopf select{min-width:0;max-width:35%}
.ckopf .status{flex:1 1 0;min-width:0;overflow:hidden}
.ckopf .status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckopf .status i{flex:0 0 8px}
.save-status{flex:0 0 14ch;font-size:11px;color:var(--ink3);white-space:nowrap;text-align:right}
.save-status.fehler{color:var(--bad)}
.ckopf b{font-size:12.5px}.ckopf .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}.status.an i{background:var(--good)}
.innen{display:grid;grid-template-columns:minmax(0,1fr) 180px;min-height:0}
.verlauf{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;border-right:1px solid var(--line)}
.msgs{overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.msg{border-radius:6px;padding:6px 9px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;font-size:12.5px;border:1px solid transparent}
.msg.user{align-self:flex-end;background:var(--acw)}
.msg.claude{align-self:flex-start;background:var(--panel)}
.msg .meta{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px}
.msg .pm{display:inline-block;font-size:10px;border:1px solid var(--line2);border-radius:8px;padding:0 6px;margin-right:4px}
.msg.fehler{border-color:var(--bad)}.msg.fehler .meta{color:var(--bad);font-weight:600}.msg.sende{opacity:.75}
.arbeitet{align-self:flex-start;font-size:12px;color:var(--ac);padding:2px 4px}
.msg.episode{border-color:var(--mark);box-shadow:0 0 0 2px var(--markbg)}
.msg .vlink{color:var(--ac);cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line2);border-radius:10px;padding:1px 7px;background:var(--surf);max-width:100%}
.chip b{font-weight:600;color:var(--ac);white-space:nowrap}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip button{border:0;padding:0 2px;background:none;font-size:12px;line-height:1;color:var(--ink3)}
.eingabe{border-top:1px solid var(--line);padding:7px 8px;display:grid;gap:5px}
.eingabe.ziel{background:var(--acw)}
.eingabe .ziele{font-size:11px;color:var(--ink3)}
.tfeld{position:relative;background:var(--surf);border:1px solid var(--line2);border-radius:4px}
.tfeld:focus-within{outline:2px solid var(--ac);outline-offset:1px}
.eingabe textarea,.spiegel{font:inherit;font-size:12.5px;line-height:1.5;padding:6px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:normal}
.eingabe textarea{position:relative;z-index:1;display:block;width:100%;min-height:58px;max-height:40vh;border:0;background:transparent;color:var(--ink);resize:vertical;outline:none}
.spiegel{position:absolute;inset:0;color:transparent;overflow:hidden;pointer-events:none}
.spiegel mark{color:transparent;background:var(--acw);border-radius:3px;box-shadow:0 0 0 1.5px var(--ac)}
.spiegel mark.fremd{background:var(--markbg);box-shadow:0 0 0 1.5px var(--mark)}
.chip .rf{font-weight:700;color:#fff;background:var(--ac);border-radius:7px;padding:0 5px;font-size:10px}
.chip.nicht{opacity:.6}.chip.nicht::after{content:'nicht im Text';font-size:10px;color:var(--ink3)}
.msg .ref{background:var(--acw);border:1px solid var(--ac);border-radius:6px;padding:0 4px;font-size:11px;font-weight:600;color:var(--ac);cursor:help}
.eingabe .reihe{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.eingabe .reihe .sp{margin-left:auto}
.versionen{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0}
.versionen h3{font-size:11px;color:var(--ink3);margin:0;padding:7px 8px 4px;font-weight:600}
.neu{padding:0 6px 6px;display:grid;gap:4px}
.neu input{width:100%}.neu .reihe{display:flex;gap:4px}
.vliste{overflow:auto;padding:0 6px;display:flex;flex-direction:column;gap:3px}
.vitem{border:1px solid var(--line);border-radius:4px;padding:4px 6px;cursor:pointer;font-size:11.5px;background:var(--surf)}
.vitem:hover{border-color:var(--ac)}.vitem.gezeigt{border-color:var(--ac);background:var(--acw)}
.vitem small{display:block;color:var(--ink3);font-variant-numeric:tabular-nums}
.vitem .nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vfuss{padding:6px}.vfuss button{width:100%}
@media (max-width:620px){.chat{width:calc(100vw - 16px)!important;left:8px!important}.innen{grid-template-columns:1fr}.versionen{display:none}}
</style>
</head><body>
<div class="lokalleiste"><b>UI-Werkbank</b><small>Nachricht schreiben · gemeinsam an der Oberfläche arbeiten</small></div>
<div class="vleiste" id="vleiste"></div>
<div class="flaeche">
  <div class="rahmen"><iframe id="frame" title="Mockup"></iframe>
    <div class="ueber" id="ueber" hidden><div class="ueberLeiste" id="ueberLeiste"></div><svg id="ueberSvg"></svg></div></div>
  <div class="aend" id="aend"><h2>Änderungen dieser Version</h2><span class="leer">lädt …</span></div>
</div>

<div class="chat" id="chat">
  <div class="rz" data-d="n"></div><div class="rz" data-d="s"></div><div class="rz" data-d="e"></div><div class="rz" data-d="w"></div>
  <div class="rz" data-d="ne"></div><div class="rz" data-d="nw"></div><div class="rz" data-d="se"></div><div class="rz" data-d="sw"></div>
  <div class="ckopf" id="ckopf"><b>Chat</b>
    <select id="chatProj" title="Projekt, an dem wir im Chat arbeiten: neue Versionen entstehen hier"></select>
    <span class="status" id="status"><i></i><span>prüft …</span></span>
    <span class="save-status" id="saveStatus" aria-label="Speicherstatus">prüft …</span>
    <span class="sp"><button id="klein" title="minimieren">–</button></span></div>
  <div class="innen">
    <div class="verlauf">
      <div class="msgs" id="msgs"></div>
      <div class="eingabe" id="eingabe">
        <div class="ziele" id="ziele"></div>
        <div class="chips" id="entwurfChips"></div>
        <div class="tfeld"><div class="spiegel" id="spiegel" aria-hidden="true"></div>
        <textarea id="text" placeholder="Nachricht schreiben …"></textarea></div>
        <div class="reihe"><button id="picker" title="Elemente im angezeigten Mockup anklicken und anhängen (Esc beendet)">Auswählen</button>
          <button id="snapBtn" title="Mockup einfrieren, Stellen markieren und als Paket (Zustand, Markierungen mit Treffern, Bild) anhängen">Snapshot</button><button id="snapWeg" hidden title="Snapshot verwerfen">Verwerfen</button>
          <span class="hinweis" id="pickhinweis" role="status"></span><span class="sp"><button id="senden" class="on" disabled>Senden</button></span></div>
      </div>
    </div>
    <div class="versionen">
      <h3 id="vtitel">Versionen</h3>
      <div class="neu" id="neu" hidden><input type="text" id="neuName" placeholder="Name, z. B. Einstiegsoberfläche" maxlength="60">
        <div class="reihe"><button id="neuOk" class="on">Anlegen</button><button id="neuAb">Abbrechen</button></div></div>
      <div class="vliste" id="vliste"></div>
      <div class="vfuss"><button id="aktuell">Aktuelle zeigen</button></div>
    </div>
  </div>
</div>

<script src="local-adapter.js"></script>
<script>
/* ================================================================ Zustand
   Zwei Zeiger: der Chat-Stand (chatP/chatV: woran wir arbeiten, Ziel neuer Versionen) und die Ansicht (ansP/ansV: was das
   Mockup zeigt). Klicks im Chatfenster stellen die Ansicht auf den Chat-Stand; die Wahl oben ändert nur die Ansicht. */
const $ = s => document.getElementById(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');
let PROJ = [], VERS = [], MSGS = [], entwurf = [], picken = false, markiert = null, vergleich = false;
let chatP = null, chatV = null, ansP = null, ansV = null;
let db = null, dienste = null, sendet = false, wiederherstellen = true, oberflaecheBereit = false;
let pendingMessage = null;
const OFFEN = new Map();   // Nachrichten, die gerade gesendet werden: sofort sichtbar, bis die Datenbank sie liefert
const zeit = iso => { if (!iso) return ''; const d = new Date(iso), h = new Date();
  const hm = d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
  return d.toDateString() === h.toDateString() ? hm : d.toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit'}) + ' ' + hm; };
const lokal = {get(k, d) { return dienste ? dienste.preferences.get(k, d) : d; },
  set(k, v) { if (dienste) dienste.preferences.set(k, v); }};
const projekt = p => PROJ.find(x => x.id === p) || {id: p, name: p || '–'};
const vListe = p => VERS.filter(v => v.projekt === p).sort((a, b) => a.nr - b.nr);
const version = (p, nr) => VERS.find(v => v.projekt === p && v.nr === nr);
const letzte = p => { const l = vListe(p); return l.length ? l[l.length - 1].nr : null; };
const vorgaenger = (p, nr) => vListe(p).filter(v => v.nr < nr).pop();
const gekoppelt = () => ansP === chatP && ansV === chatV;

/* ================================================================ Ansicht (Mockup im Rahmen) */
function ansichtSetzen(p, nr) {
  ansP = p; ansV = nr; vergleich = false; markiert = null;
  const v = nr == null ? null : version(p, nr);
  if (v) { $('frame').removeAttribute('srcdoc'); $('frame').src = v.datei; }
  else { $('frame').removeAttribute('src'); $('frame').srcdoc = `<body style="font:14px system-ui;color:#7c7a74;display:grid;place-items:center;height:90vh;margin:0">
      <div style="max-width:46ch;text-align:center">${p ? `Projekt „${esc(projekt(p).name)}“ hat noch keine Version.<br>Beschreib im Chat, was entstehen soll.` : 'Noch kein Projekt.<br>Oben im Chat „+ Neues Projekt …“ wählen und einen Namen vergeben.'}</div></body>`; }
  lokal.set('ansicht', {p, nr}); leiste(); aenderungen();
}
function zumChat() { ansichtSetzen(chatP, chatV); versionsliste(); episode(true); }
function chatSetzen(p, nr, {folgen = true} = {}) {
  chatP = p; chatV = nr; lokal.set('chat', {p, nr}); $('chatProj').value = p; versionsliste(); ziele(); episode(true);
  if (folgen) ansichtSetzen(p, nr);
}
function frameDoc() { try { return $('frame').contentDocument; } catch (e) { return null; } }
$('frame').addEventListener('load', () => { const d = frameDoc(); if (!d || !d.head) return;
  const st = d.createElement('style');
  st.textContent = `.wb-mark{outline:3px solid #e0b000!important;outline-offset:3px;filter:drop-shadow(0 0 3px #e0b000) drop-shadow(0 0 1px #e0b000)}
    .wb-hover{outline:2px dashed #1c5cab!important;outline-offset:2px;filter:drop-shadow(0 0 2px #1c5cab);cursor:crosshair!important}
    .wb-gewaehlt{outline:2px solid #1c5cab!important;outline-offset:2px}`;
  d.head.appendChild(st);
  if (picken) pickerAn();
  if (markiert != null) markieren(markiert);
});

/* ================================================================ Ansichtsleiste oben: Projekt- und Versionsbrowser */
function leiste() {
  const L = vListe(ansP); const akt = letzte(ansP); const v = ansV == null ? null : version(ansP, ansV);
  const seit = L.filter(x => x.nr > ansV).length; const istAkt = ansV === akt;
  const vorg = ansV == null ? null : vorgaenger(ansP, ansV);
  const pOpt = PROJ.map(p => `<option value="${esc(p.id)}" ${p.id === ansP ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const vOpt = L.map(x => `<option value="${x.nr}" ${x.nr === ansV ? 'selected' : ''}>Version ${x.nr}</option>`).join('') || '<option>keine Version</option>';
  const info = vergleich && vorg ? `<span class="n">Vergleich: Version ${vorg.nr}, Vorgänger von Version ${ansV}</span>`
    : (v ? `<span class="n" title="${esc(v.name)}">${esc(v.name)}</span><span class="m">${zeit(v.t)}</span>${istAkt ? '<span class="m">aktuelle Version</span>' : `<span class="m">${seit} ${seit === 1 ? 'Version' : 'Versionen'} seitdem · Aktuell: Version ${akt}</span>`}` : '');
  $('vleiste').innerHTML = `<span class="lab">Ansicht</span><select id="ansProj" title="Projekt anzeigen (ändert den Chat nicht)">${pOpt}</select><select id="ansVer" title="Version anzeigen (ändert den Chat nicht)">${vOpt}</select>${info}
    <span class="sp">${gekoppelt() ? '' : `<span class="abweich">weicht vom Chat ab (${esc(projekt(chatP).name)}${chatV ? ' V' + chatV : ''})</span><button id="zumChat">Zum Chat-Stand</button>`}
      ${vorg ? `<button id="vgl" class="${vergleich ? 'on' : ''}" title="zwischen dieser Version und ihrem Vorgänger umschalten (Taste V)">${vergleich ? 'Nachher zeigen' : 'Vorher zeigen'}</button>` : ''}
      ${v && !istAkt ? '<button id="zuakt">Zur aktuellen</button>' : ''}</span>`;
  $('vleiste').classList.toggle('alt', !!v && (!istAkt || vergleich));
  if (chatP) ziele();
  $('ansProj').onchange = e => ansichtSetzen(e.target.value, letzte(e.target.value));
  $('ansVer').onchange = e => ansichtSetzen(ansP, +e.target.value);
  if ($('zumChat')) $('zumChat').onclick = zumChat;
  if ($('vgl')) $('vgl').onclick = umschalten;
  if ($('zuakt')) $('zuakt').onclick = () => ansichtSetzen(ansP, akt);
}
function umschalten() {
  const vorg = ansV == null ? null : vorgaenger(ansP, ansV); if (!vorg) return;
  vergleich = !vergleich; $('frame').src = vergleich ? vorg.datei : version(ansP, ansV).datei; leiste();
}

/* ================================================================ Änderungen der angezeigten Version */
function aenderungen() {
  const v = ansV == null ? null : version(ansP, ansV); const a = (v && v.aenderungen) || [];
  $('aend').innerHTML = `<h2>${v ? `Änderungen in Version ${v.nr}${v.basis ? ` gegenüber ${v.basis}` : ''}` : 'Änderungen'}</h2>` +
    (a.length ? a.map((x, i) => `<div class="eintrag ${markiert === i ? 'aktiv' : ''}" data-i="${i}" tabindex="0">${esc(x.text)}${x.ziele && x.ziele.length ? '' : '<small>ohne Markierung im Bild</small>'}</div>`).join('')
      : '<span class="leer">Keine Änderungen eingetragen.</span>') +
    (a.some(x => x.ziele && x.ziele.length) ? '<span class="hinweis">Klick markiert die Stelle im Mockup. „Vorher zeigen“ oben schaltet auf den Vorgänger um.</span>' : '');
  $('aend').querySelectorAll('.eintrag').forEach(e => { const f = () => { markiert = markiert === +e.dataset.i ? null : +e.dataset.i; if (vergleich) umschalten(); markieren(markiert); aenderungen(); };

      + ((t.kollisionen || []).length ? ` · Überlappung: ${t.kollisionen.map(k => `„${k.a}“ × „${k.b}“ ${k.ueberlappung.join('×')} px`).join('; ')}` : '')
      + ((t.ueberstand || []).length ? ` · ragt über: ${t.ueberstand.map(u => `„${u.label}“ ${u.ragt}`).join('; ')}` : ''); });
  const e = (p.elemente || []).map(x => `${x.nr} ${tr(x)}`);
  return `Snapshot (Datenbank snapshots/${id}, Bild ${p.bild && p.bild.asset ? 'Asset ' + p.bild.asset : (p.bild && p.bild.daten ? 'eingebettet' : 'fehlt')}) · Zustand: ${zustandKurz(p.zustand)}\n  ${m.concat(e).join('\n  ')}`;
}

/* Nur reine Daten in die Datenbank: kein undefined/NaN/Infinity, höchstens 20 Ebenen, Zustand höchstens 60 KB */
function sauber(o, tiefe = 0) {
  if (o === null || typeof o === 'boolean' || typeof o === 'string') return o;
  if (typeof o === 'number') return Number.isFinite(o) ? o : null;
  if (tiefe > 20) return null;
  if (Array.isArray(o)) return o.map(x => { const v = sauber(x, tiefe + 1); return v === undefined ? null : v; });
  if (typeof o === 'object') { const r = {}; Object.entries(o).forEach(([k, v]) => { if (!k || /^__.*__$/.test(k)) return; const x = sauber(v, tiefe + 1); if (x !== undefined) r[k] = x; }); return r; }
  return undefined;
}
/* Saving and dispatching share one server transaction; retries reuse the message ID. */
async function senden() {
  if (sendet || !dienste) return;
  if (!chatP) { alertZeile('Zuerst ein Projekt anlegen: oben im Chat „+ Neues Projekt …“.'); $('neu').hidden = false; $('neuName').focus(); return; }
  const text = ta.value.trim(); if (!text && !entwurf.length) { alertZeile('Text schreiben oder Referenzen anhängen.'); return; }
  sendet = true; $('senden').disabled = true; $('senden').textContent = 'speichert …'; alertZeile('');
  let id = null;
  try {
    const chips = entwurf.slice();
    for (const c of chips) if (c.art === 'snapshot' && !(await paketLaden(c.snap))) throw new Error('Snapshot fehlt: ' + c.ref);
    const signature = JSON.stringify({text, chips, projekt: chatP, version: chatV});
    if (!pendingMessage || pendingMessage.signature !== signature) {
      const reply_to=window.werkbankQuestion ? await window.werkbankQuestion(chatP) : null;
      const zst = zustandLesen();
      const refs = chips.map(c => `${c.ref} = ` + (c.art === 'snapshot' ? snapKurz(SNAPS.get(c.snap), c.snap) : `${projekt(c.projekt).name} V${c.version}: ${c.label}`)).join('\n');
      const data = sauber({rolle: 'user', text, chips, projekt: chatP, version: chatV, follow_latest: chatV === letzte(chatP), reply_to,
        ansicht: {projekt: ansP, version: ansV}, zustand: zst, t: new Date().toISOString(), status: 'wartet',
        auftragstext: `Ziel: ${projekt(chatP).name} V${chatV || 'neu'}\nZustand der Ansicht: ${zustandKurz(zst)}\n\n${text}\n${refs}`});
      pendingMessage = {id: 'm-' + crypto.randomUUID(), signature, data}; lokal.set('pendingMessage', pendingMessage);
    }
    id = pendingMessage.id;
    OFFEN.set(id, {id, ...pendingMessage.data, status: 'sende'}); chatRender();
    const result = await dienste.messages.submit(id, pendingMessage.data);
    OFFEN.set(id, {id, ...result.data}); chatRender();
    pendingMessage = null; lokal.set('pendingMessage', null);
    ta.value = ''; marke = null; entwurf = []; entwurfRender(); pickMarken();
    alertZeile(window.werkbankTerminalBound ? 'Gesendet.' : 'Gespeichert. In deiner Sitzung uiworkbench aufrufen.');
  } catch (e) {
    if (id && pendingMessage) OFFEN.set(id, {id, ...pendingMessage.data, status: 'fehler', fehler: e.message || e.code});
    chatRender(); alertZeile('Speichern nicht bestätigt: ' + (e.message || e.code || e) + ' Der Entwurf bleibt erhalten; erneut senden.');
  } finally {
    sendet = false; $('senden').disabled = false; $('senden').textContent = 'Senden'; statusPruefen();
  }
}
$('senden').onclick = senden;
snapZeiger();
$('snapBtn').onclick = () => { if (SNAP && !SNAP.nurAnsicht) snapAnhaengen(); else { if (SNAP) snapBeenden(); snapStart(); } };
$('snapWeg').onclick = () => { snapBeenden(); alertZeile('Snapshot verworfen.'); };

/* ================================================================ Chatfenster: verschieben, an allen Rändern ziehen, minimieren */
const chat = $('chat');
const MIN_W = 380, MIN_H = 300;
function lage() { const p = lokal.get('lage', null);
  if (p) { chat.style.left = Math.max(0, Math.min(p.x, innerWidth - 120)) + 'px'; chat.style.top = Math.max(0, Math.min(p.y, innerHeight - 40)) + 'px'; if (p.w) { chat.style.width = p.w + 'px'; chat.style.height = p.h + 'px'; } }
  else { chat.style.left = Math.max(8, innerWidth - 620) + 'px'; chat.style.top = Math.max(8, innerHeight - 580) + 'px'; }
  chat.classList.toggle('klein', !!lokal.get('klein', false)); $('klein').textContent = chat.classList.contains('klein') ? '▢' : '–'; }
function merkeLage() { const k = chat.classList.contains('klein'); lokal.set('lage', {x: chat.offsetLeft, y: chat.offsetTop, w: k ? null : chat.offsetWidth, h: k ? null : chat.offsetHeight}); }
let zug = null;
$('ckopf').onpointerdown = ev => { if (ev.target.closest('button,select')) return; zug = {x: ev.clientX - chat.offsetLeft, y: ev.clientY - chat.offsetTop}; $('ckopf').setPointerCapture(ev.pointerId); };
$('ckopf').onpointermove = ev => { if (!zug) return; chat.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - zug.x)) + 'px'; chat.style.top = Math.max(0, Math.min(innerHeight - 30, ev.clientY - zug.y)) + 'px'; };
$('ckopf').onpointerup = () => { if (!zug) return; zug = null; merkeLage(); };
chat.querySelectorAll('.rz').forEach(g => {
  let st = null;
  g.onpointerdown = ev => { ev.preventDefault(); g.setPointerCapture(ev.pointerId); $('frame').style.pointerEvents = 'none';
    st = {x: ev.clientX, y: ev.clientY, l: chat.offsetLeft, t: chat.offsetTop, w: chat.offsetWidth, h: chat.offsetHeight, d: g.dataset.d}; };
  g.onpointermove = ev => { if (!st) return; const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
    let {l, t, w, h} = st;
    if (st.d.includes('e')) w = Math.max(MIN_W, Math.min(innerWidth - l, st.w + dx));
    if (st.d.includes('s')) h = Math.max(MIN_H, Math.min(innerHeight - t, st.h + dy));
    if (st.d.includes('w')) { w = Math.max(MIN_W, Math.min(st.l + st.w, st.w - dx)); l = st.l + st.w - w; }
    if (st.d.includes('n')) { h = Math.max(MIN_H, Math.min(st.t + st.h, st.h - dy)); t = st.t + st.h - h; }
    Object.assign(chat.style, {left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px'}); };
  g.onpointerup = () => { if (!st) return; st = null; $('frame').style.pointerEvents = ''; merkeLage(); };
});
$('klein').onclick = () => { chat.classList.toggle('klein'); lokal.set('klein', chat.classList.contains('klein')); $('klein').textContent = chat.classList.contains('klein') ? '▢' : '–'; };

/* ================================================================ Local service connection */
async function statusPruefen() {
  const status = dienste ? await dienste.status() : {online: false, pending: 0};
  $('status').classList.toggle('an', !!status.online && !!window.werkbankTerminalReady);
  $('status').classList.toggle('fehler', !status.online);
  const connection = !status.online ? 'Server nicht erreichbar' : (window.werkbankTerminalStatus || 'Lokal · kein Agent verbunden');
  const label = $('status').querySelector('span');
  if (label.textContent !== connection) label.textContent = connection;
  $('status').title = connection;
  const saving = !status.online ? (status.pending ? 'Ungespeichert' : 'Server offline') : status.pending ? 'Speichert …' : 'Gespeichert';
  if ($('saveStatus').textContent !== saving) $('saveStatus').textContent = saving;
  $('saveStatus').classList.toggle('fehler', !status.online);
}
window.addEventListener('werkbank-storage', () => { if (dienste) statusPruefen(); });
function arbeitsstandMerken() {
  if (!oberflaecheBereit || wiederherstellen || vergleich || ansV == null) return;
  try {
    const v = version(ansP, ansV), d = frameDoc();
    if (!v || !d || d.URL !== new URL(v.datei, location.href).href || d.readyState !== 'complete') return;
    const state = zustandLesen(); if (state) lokal.set('ansichtZustand', sauber(state));
  } catch (_) { /* An unreadable mockup must not erase the last recorded view. */ }
}
async function arbeitsstandLaden() {
  const saved = lokal.get('ansichtZustand', null);
  try {
    if (saved && saved.projekt === ansP && saved.version === ansV) {
      await ladeVersion(ansP, ansV); await zustandSetzen(saved);
    }
  } catch (e) { alertZeile('Arbeitsansicht nicht vollständig wiederhergestellt: ' + e.message); }
  finally { wiederherstellen = false; oberflaecheBereit = true; $('senden').disabled = false; }
}
// Capture the final view before the adapter's pagehide handler flushes pending writes.
window.addEventListener('pagehide', arbeitsstandMerken, {capture: true});
setInterval(arbeitsstandMerken, 700);
function start() {
  const c = lokal.get('chat', null), a = lokal.get('ansicht', null);
  const gueltigP = p => PROJ.some(x => x.id === p);
  chatP = c && gueltigP(c.p) ? c.p : (PROJ[0] ? PROJ[0].id : null); chatV = chatP && c && version(chatP, c.nr) ? c.nr : letzte(chatP);
  projektwahl(); versionsliste(); ziele();
  if (a && gueltigP(a.p) && (a.nr == null || version(a.p, a.nr))) ansichtSetzen(a.p, a.nr); else ansichtSetzen(chatP, chatV);
  episode(true);
  if (!chatP) { $('neu').hidden = false; alertZeile('Willkommen. Lege zuerst ein Projekt an; danach kannst du im Chat beschreiben, was entstehen soll.'); }
}
(async () => {
  dienste = await window.werkbankServices.connect();
  db = dienste.db; assets = dienste.assets;
  lage();
  pendingMessage = lokal.get('pendingMessage', null);
  const draft = lokal.get('entwurf', null);
  if (draft) { ta.value = draft.text || ''; entwurf = draft.chips || []; entwurfRender(); }
  await statusPruefen();
  let bereit = {p: false, v: false}, gestartet = false;
  const weiter = () => { if (!gestartet && bereit.p && bereit.v) { gestartet = true; start(); chatRender(); arbeitsstandLaden(); } };
  db.collection('projekte').orderBy('t').onSnapshot(s => {
    PROJ = s.docs.map(d => ({id: d.id, ...d.data()}));
    bereit.p = true;
    if (gestartet) { projektwahl(); leiste(); versionsliste(); if (!chatP && PROJ.length) { $('neu').hidden = true; chatSetzen(PROJ[0].id, letzte(PROJ[0].id)); alertZeile(''); } }
    weiter();
  }, err => { alertZeile('Projekte nicht lesbar: ' + err.code); });
  db.collection('versionen').onSnapshot(s => {
    const vorChat = letzte(chatP), vorAns = letzte(ansP), warGekoppelt = gekoppelt();
    VERS = s.docs.map(d => ({id: d.id, ...d.data()})); bereit.v = true;
    if (!gestartet) { weiter(); return; }
    if (chatV === vorChat && letzte(chatP) !== vorChat) chatSetzen(chatP, letzte(chatP), {folgen: warGekoppelt});
    else if (!warGekoppelt && ansV === vorAns && letzte(ansP) !== vorAns) ansichtSetzen(ansP, letzte(ansP));
    else { versionsliste(); leiste(); aenderungen(); }
  }, err => { alertZeile('Versionen nicht lesbar: ' + err.code); });
  db.collection('nachrichten').orderBy('t').onSnapshot(s => { MSGS = s.docs.map(d => ({id: d.id, ...d.data()})); if (gestartet) chatRender(); },
    err => { alertZeile('Verlauf nicht lesbar: ' + err.code); });
})().catch(e => {
  $('status').classList.add('fehler'); $('status').querySelector('span').textContent = 'Lokaler Dienst nicht erreichbar';
  $('aend').innerHTML = '<span class="leer">Werkbank mit „python3 werkbank.py start“ (oder „Werkbank starten.command“) starten und diese Seite über http://127.0.0.1:8119 öffnen.</span>';
  alertZeile('Start fehlgeschlagen: ' + (e.message || e));
});
